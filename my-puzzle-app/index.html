<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解錠せよ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #000000;
      color: #facc15;
      font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
    }

    /* 基本の白マス */
    .square-input {
      background-color: #ffffff !important;
      color: #000000 !important;
      font-weight: 800;
      text-align: center;
      outline: none;
      transition: all 0.2s;
    }
    
    /* ロック中の入力欄 */
    .square-input:disabled {
      background-color: #333333 !important;
      color: #666666 !important;
      cursor: not-allowed;
      border-color: #444444 !important;
    }

    /* STEP2の熟語ブロック枠 */
    .word-block {
      display: inline-flex;
      border: 2px solid #facc15;
      border-radius: 4px;
      overflow: hidden;
      background-color: #ffffff;
    }
    
    .word-block.disabled {
      border-color: #444444;
      opacity: 0.4;
    }

    .word-block input {
      border: none;
      border-right: 1px solid #e5e7eb; /* 熟語内の薄い区切り線 */
    }

    .word-block input:last-child {
      border-right: none;
    }
  </style>
</head>
<body class="min-h-screen py-8 px-2 sm:px-4 flex flex-col items-center justify-center">

  <main class="w-full max-w-xl space-y-8 border border-yellow-500/30 p-5 sm:p-8 rounded-lg bg-black">
    
    <!-- タイトル -->
    <header class="text-center border-b border-yellow-500/30 pb-4">
      <h1 class="text-3xl font-extrabold tracking-widest text-yellow-400">解錠せよ</h1>
    </header>

    <form id="puzzleForm" class="space-y-8">

      <!-- STEP 1 -->
      <section class="space-y-4">
        <h2 class="text-base sm:text-lg font-bold text-yellow-400">STEP1 マスに0~9の数字を入れ、正しい式を作れ</h2>
        
        <div class="flex items-center justify-center gap-1 sm:gap-2 text-yellow-400 font-extrabold font-mono text-base sm:text-2xl overflow-x-auto py-2">
          <!-- 語1 (2桁) -->
          <div class="flex gap-1">
            <input type="text" id="d0" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" required>
            <input type="text" id="d1" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" required>
          </div>
          
          <span class="px-0.5">+</span>
          
          <!-- 語2 (2桁) -->
          <div class="flex gap-1">
            <input type="text" id="d2" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" required>
            <input type="text" id="d3" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" required>
          </div>
          
          <span class="px-0.5">+</span>
          
          <!-- 語3 (2桁) -->
          <div class="flex gap-1">
            <input type="text" id="d4" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" required>
            <input type="text" id="d5" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" required>
          </div>
          
          <span class="px-0.5">=</span>
          
          <!-- 語4 (自動計算される3桁・入力不可) -->
          <div class="flex gap-1">
            <input type="text" id="d6" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" readonly tabindex="-1">
            <input type="text" id="d7" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" readonly tabindex="-1">
            <input type="text" id="d8" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" readonly tabindex="-1">
          </div>
        </div>
      </section>

      <!-- STEP 2 -->
      <section id="step2Section" class="space-y-4 opacity-50 pointer-events-none transition-all">
        <div class="flex items-center justify-between">
          <h2 class="text-base sm:text-lg font-bold text-yellow-400">STEP2 マスに正しい漢字を入れ、4つの熟語を作れ</h2>
          <span id="step2LockMsg" class="text-xs text-red-400 font-normal">※STEP1を完成させてください</span>
        </div>

        <!-- 熟語ごとに繋がったブロック構造 -->
        <div class="flex items-center justify-center gap-2 sm:gap-4 overflow-x-auto py-2">
          <!-- 熟語1 (2文字ブロック) -->
          <div class="word-block disabled" id="wb1">
            <input type="text" id="w1_1" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" disabled required>
            <input type="text" id="w1_2" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" disabled required>
          </div>

          <!-- 熟語2 (2文字ブロック) -->
          <div class="word-block disabled" id="wb2">
            <input type="text" id="w2_1" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" disabled required>
            <input type="text" id="w2_2" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" disabled required>
          </div>

          <!-- 熟語3 (2文字ブロック) -->
          <div class="word-block disabled" id="wb3">
            <input type="text" id="w3_1" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" disabled required>
            <input type="text" id="w3_2" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" disabled required>
          </div>

          <!-- 熟語4 (3文字ブロック) -->
          <div class="word-block disabled" id="wb4">
            <input type="text" id="w4_1" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" disabled required>
            <input type="text" id="w4_2" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" disabled required>
            <input type="text" id="w4_3" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" disabled required>
          </div>
        </div>
      </section>

      <!-- STEP 3 -->
      <section class="space-y-4">
        <h2 class="text-base sm:text-lg font-bold text-yellow-400">STEP3 正しいパスワードを入れ、解錠せよ</h2>

        <div class="bg-gray-950 border border-yellow-500/30 p-4 rounded text-center space-y-2">
          <p class="text-xs text-yellow-500/70">暗号文</p>
          <div id="cipherDisplay" class="text-sm font-mono text-yellow-300">
            [解錠ボタンを押すと判定結果が表示されます]
          </div>
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-extrabold py-3.5 rounded text-lg transition-all active:scale-[0.98]"
        >
          解錠（判定）
        </button>

        <div id="result" class="hidden rounded p-4 text-center text-sm font-bold border"></div>
      </section>

    </form>
  </main>

  <script>
    // STEP1: 数字入力欄
    const leftInputs = ['d0', 'd1', 'd2', 'd3', 'd4', 'd5'].map(id => document.getElementById(id));
    const rightInputs = ['d6', 'd7', 'd8'].map(id => document.getElementById(id));

    // STEP2: 漢字入力欄・セクション要素
    const kanjiInputIds = ['w1_1', 'w1_2', 'w2_1', 'w2_2', 'w3_1', 'w3_2', 'w4_1', 'w4_2', 'w4_3'];
    const kanjiInputs = kanjiInputIds.map(id => document.getElementById(id));
    const step2Section = document.getElementById('step2Section');
    const step2LockMsg = document.getElementById('step2LockMsg');
    const wordBlocks = ['wb1', 'wb2', 'wb3', 'wb4'].map(id => document.getElementById(id));

    // STEP1の入力・自動計算イベント処理
    leftInputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/[^0-9]/g, '');
        
        // フォーカス移動
        if (input.value && index < leftInputs.length - 1) {
          leftInputs[index + 1].focus();
        }

        calculateStep1();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          leftInputs[index - 1].focus();
        }
      });
    });

    // STEP1 の右辺（足し算結果）自動計算 & STEP2 のアンロック処理
    function calculateStep1() {
      const vals = leftInputs.map(i => i.value);
      const isComplete = vals.every(v => v !== '');

      if (isComplete) {
        const num1 = parseInt(vals[0] + vals[1], 10);
        const num2 = parseInt(vals[2] + vals[3], 10);
        const num3 = parseInt(vals[4] + vals[5], 10);
        const sum = num1 + num2 + num3;

        // 3桁の文字列にフォーマット（例: 085 や 124）
        const sumStr = String(sum).padStart(3, '0');

        if (sumStr.length === 3) {
          rightInputs[0].value = sumStr[0];
          rightInputs[1].value = sumStr[1];
          rightInputs[2].value = sumStr[2];

          // STEP 2 を解放（アンロック）
          unlockStep2();
          return;
        }
      }

      // 未完成時は右辺クリア & STEP 2 ロック
      rightInputs.forEach(i => i.value = '');
      lockStep2();
    }

    function unlockStep2() {
      step2Section.classList.remove('opacity-50', 'pointer-events-none');
      step2LockMsg.classList.add('hidden');
      wordBlocks.forEach(wb => wb.classList.remove('disabled'));
      kanjiInputs.forEach(input => input.disabled = false);
    }

    function lockStep2() {
      step2Section.classList.add('opacity-50', 'pointer-events-none');
      step2LockMsg.classList.remove('hidden');
      wordBlocks.forEach(wb => wb.classList.add('disabled'));
      kanjiInputs.forEach(input => {
        input.disabled = true;
        input.value = '';
      });
    }

    // 漢字マスの自動フォーカス移動
    kanjiInputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        if (input.value && index < kanjiInputs.length - 1) {
          kanjiInputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          kanjiInputs[index - 1].focus();
        }
      });
    });

    // フォーム検証・送信処理
    const form = document.getElementById('puzzleForm');
    const resultDiv = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');
    const cipherDisplay = document.getElementById('cipherDisplay');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      resultDiv.classList.add('hidden');
      resultDiv.className = 'hidden rounded p-4 text-center text-sm font-bold border';
      submitBtn.disabled = true;
      submitBtn.innerText = '検証中...';

      // 1. 数字の結合 (9桁)
      const targetDigits = leftInputs.map(i => i.value).join('') + rightInputs.map(i => i.value).join('');

      // 2. 熟語の結合 (4つ)
      const words = [
        document.getElementById('w1_1').value.trim() + document.getElementById('w1_2').value.trim(),
        document.getElementById('w2_1').value.trim() + document.getElementById('w2_2').value.trim(),
        document.getElementById('w3_1').value.trim() + document.getElementById('w3_2').value.trim(),
        document.getElementById('w4_1').value.trim() + document.getElementById('w4_2').value.trim() + document.getElementById('w4_3').value.trim()
      ];

      try {
        const response = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ targetDigits, words })
        });

        const data = await response.json();
        resultDiv.classList.remove('hidden');

        if (data.success) {
          resultDiv.classList.add('bg-yellow-400', 'text-black', 'border-yellow-400');
          resultDiv.innerHTML = `🎉 解錠成功！<br>正解です！`;
          cipherDisplay.innerText = `解錠鍵: ${data.readings.join(' / ')}`;
        } else {
          resultDiv.classList.add('bg-red-950', 'text-red-400', 'border-red-800');
          resultDiv.innerText = data.error || '解錠に失敗しました。';
        }
      } catch (err) {
        resultDiv.classList.remove('hidden');
        resultDiv.classList.add('bg-red-950', 'text-red-400', 'border-red-800');
        resultDiv.innerText = '通信エラーが発生しました。';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '解錠（判定）';
      }
    });
  </script>
</body>
</html>

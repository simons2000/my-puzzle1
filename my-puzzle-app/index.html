<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暗号パズル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4 text-slate-800">

  <div class="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-none shadow-lg border border-slate-200">
    <h1 class="text-2xl sm:text-3xl font-extrabold text-center text-slate-800 mb-8 tracking-wide">
      🧩 謎解き暗号パズル
    </h1>

    <!-- STEP 1 -->
    <section class="mb-8 p-5 sm:p-6 bg-slate-50 rounded-none border border-slate-300">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base sm:text-lg font-bold text-slate-700 flex items-center gap-2">
          <span class="w-6 h-6 rounded-none bg-blue-600 text-white text-xs flex items-center justify-center font-extrabold">1</span>
          STEP 1: 数式を完成させよ
        </h2>
        <span id="step1-mark" class="text-2xl">⬜</span>
      </div>
      <p class="text-xs sm:text-sm text-slate-500 mb-5">足し算の左辺に数字を入れると、右辺が自動的に計算されます。</p>
      
      <div class="flex flex-wrap items-center justify-center gap-1 sm:gap-2 text-xl font-bold">
        <!-- 23 -->
        <div class="flex shadow-sm">
          <input type="text" maxlength="1" class="step1-left-in w-9 h-11 text-center border border-slate-400 rounded-none bg-white focus:z-10 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
          <input type="text" maxlength="1" class="step1-left-in w-9 h-11 text-center border-t border-b border-r border-slate-400 rounded-none bg-white focus:z-10 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
        </div>
        <span class="text-slate-400 font-normal px-1">+</span>
        <!-- 38 -->
        <div class="flex shadow-sm">
          <input type="text" maxlength="1" class="step1-left-in w-9 h-11 text-center border border-slate-400 rounded-none bg-white focus:z-10 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
          <input type="text" maxlength="1" class="step1-left-in w-9 h-11 text-center border-t border-b border-r border-slate-400 rounded-none bg-white focus:z-10 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
        </div>
        <span class="text-slate-400 font-normal px-1">+</span>
        <!-- 94 -->
        <div class="flex shadow-sm">
          <input type="text" maxlength="1" class="step1-left-in w-9 h-11 text-center border border-slate-400 rounded-none bg-white focus:z-10 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
          <input type="text" maxlength="1" class="step1-left-in w-9 h-11 text-center border-t border-b border-r border-slate-400 rounded-none bg-white focus:z-10 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
        </div>
        <span class="text-slate-400 font-normal px-1">=</span>
        <!-- 右辺（自動入力・ロック） -->
        <div class="flex shadow-sm opacity-80">
          <input type="text" maxlength="1" readonly class="step1-right-in w-9 h-11 text-center border border-slate-400 rounded-none bg-slate-200 font-mono text-slate-600 select-none cursor-not-allowed">
          <input type="text" maxlength="1" readonly class="step1-right-in w-9 h-11 text-center border-t border-b border-slate-400 bg-slate-200 font-mono text-slate-600 select-none cursor-not-allowed">
          <input type="text" maxlength="1" readonly class="step1-right-in w-9 h-11 text-center border border-slate-400 rounded-none bg-slate-200 font-mono text-slate-600 select-none cursor-not-allowed">
        </div>
      </div>
    </section>

    <!-- STEP 2 -->
    <section id="step2-container" class="mb-8 p-5 sm:p-6 bg-slate-50 rounded-none border border-slate-300 opacity-40 pointer-events-none transition-all duration-300">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base sm:text-lg font-bold text-slate-700 flex items-center gap-2">
          <span class="w-6 h-6 rounded-none bg-blue-600 text-white text-xs flex items-center justify-center font-extrabold">2</span>
          STEP 2: 指定の画数に従って熟語を入力せよ
        </h2>
        <span id="step2-mark" class="text-2xl">⬜</span>
      </div>
      <p class="text-xs sm:text-sm text-slate-500 mb-5">各文字の画数がSTEP 1の数字（全9桁）と一致する熟語を入力してください。</p>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-4">
        
        <!-- 熟語 1（2文字） -->
        <div class="flex flex-col items-center bg-white p-3 border border-slate-300 rounded-none shadow-sm">
          <span class="text-[11px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-none mb-2 border border-blue-200">2字熟語</span>
          <input type="text" maxlength="2" class="step2-word-in w-full h-11 text-center border border-slate-400 rounded-none bg-white text-lg font-bold focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="漢字2文字">
          <div class="text-[11px] text-slate-500 mt-2 font-mono flex gap-1">
            <span class="stroke-hint">-画</span>・<span class="stroke-hint">-画</span>
          </div>
        </div>

        <!-- 熟語 2（2文字） -->
        <div class="flex flex-col items-center bg-white p-3 border border-slate-300 rounded-none shadow-sm">
          <span class="text-[11px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-none mb-2 border border-blue-200">2字熟語</span>
          <input type="text" maxlength="2" class="step2-word-in w-full h-11 text-center border border-slate-400 rounded-none bg-white text-lg font-bold focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="漢字2文字">
          <div class="text-[11px] text-slate-500 mt-2 font-mono flex gap-1">
            <span class="stroke-hint">-画</span>・<span class="stroke-hint">-画</span>
          </div>
        </div>

        <!-- 熟語 3（2文字） -->
        <div class="flex flex-col items-center bg-white p-3 border border-slate-300 rounded-none shadow-sm">
          <span class="text-[11px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-none mb-2 border border-blue-200">2字熟語</span>
          <input type="text" maxlength="2" class="step2-word-in w-full h-11 text-center border border-slate-400 rounded-none bg-white text-lg font-bold focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="漢字2文字">
          <div class="text-[11px] text-slate-500 mt-2 font-mono flex gap-1">
            <span class="stroke-hint">-画</span>・<span class="stroke-hint">-画</span>
          </div>
        </div>

        <!-- 熟語 4（3文字） -->
        <div class="flex flex-col items-center bg-white p-3 border border-slate-300 rounded-none shadow-sm">
          <span class="text-[11px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-none mb-2 border border-emerald-200">3字熟語</span>
          <input type="text" maxlength="3" class="step2-word-in w-full h-11 text-center border border-slate-400 rounded-none bg-white text-lg font-bold focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="漢字3文字">
          <div class="text-[11px] text-slate-500 mt-2 font-mono flex gap-1">
            <span class="stroke-hint">-画</span>・<span class="stroke-hint">-画</span>・<span class="stroke-hint">-画</span>
          </div>
        </div>

      </div>

      <div id="step2-msg" class="text-xs sm:text-sm text-red-500 font-medium text-center min-h-[1.25rem]"></div>
    </section>

    <!-- STEP 3 -->
    <section id="step3-container" class="p-5 sm:p-6 bg-slate-50 rounded-none border border-slate-300 opacity-40 pointer-events-none transition-all duration-300">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base sm:text-lg font-bold text-slate-700 flex items-center gap-2">
          <span class="w-6 h-6 rounded-none bg-blue-600 text-white text-xs flex items-center justify-center font-extrabold">3</span>
          STEP 3: 法則を解読して暗号を解け
        </h2>
        <span id="step3-mark" class="text-2xl">⬜</span>
      </div>
      
      <div class="bg-white p-4 rounded-none border border-slate-300 mb-5 text-sm text-slate-700 leading-relaxed shadow-sm">
        <p class="font-bold text-xs text-slate-400 uppercase tracking-wider mb-2">【解読ヒント】</p>
        <p class="mb-1">元の読み：<span id="plain-hint" class="font-mono text-slate-500">（STEP 2クリアで表示）</span></p>
        <p>暗号変換：<span id="cipher-output" class="font-mono text-blue-600 font-bold">（STEP 2クリアで表示）</span></p>
      </div>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
        <label for="final-answer" class="text-sm font-bold text-slate-700">「こたえ」を変換せよ：</label>
        <input type="text" id="final-answer" class="border border-slate-400 rounded-none px-4 py-2 text-center font-bold text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm" placeholder="変換した文字列">
        <button id="submit-btn" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold px-6 py-2.5 rounded-none shadow-md transition-all">送信</button>
      </div>
    </section>
  </div>

  <script>
    // 1. シフト暗号テーブル
    const cipherMap = {
      'あ':'い','い':'う','う':'え','え':'お','お':'か','か':'き','き':'く','く':'け','け':'こ','こ':'さ',
      'さ':'し','し':'す','す':'せ','せ':'そ','そ':'た','た':'ち','ち':'つ','つ':'て','て':'と','と':'な',
      'な':'に','に':'ぬ','ぬ':'ね','ね':'の','の':'は','は':'ひ','ひ':'ふ','ふ':'へ','へ':'ほ','ほ':'ま',
      'ま':'み','み':'む','む':'め','め':'も','も':'や','や':'ゆ','ゆ':'よ','よ':'ら','ら':'り','り':'る',
      'る':'れ','れ':'ろ','ろ':'わ','わ':'を','を':'ん','ん':'あ',
      'っ':'っ','ー':'ー'
    };

    // 2. 正確な画数辞書
    const strokeDict = {
      '一': 1,
      '人': 2, '入': 2, '八': 2, '九': 2, '七': 2, '力': 2, '十': 2,
      '口': 3, '大': 3, '小': 3, '山': 3, '川': 3, '女': 3, '子': 3, '三': 3, '千': 3,
      '月': 4, '日': 4, '水': 4, '木': 4, '火': 4, '天': 4, '文': 4, '心': 4, '手': 4, '中': 4,
      '生': 5, '立': 5, '目': 5, '田': 5, '右': 5, '左': 5, '本': 5, '白': 5, '玉': 5, '学': 5,
      '気': 6, '字': 6, '竹': 6, '名': 6, '百': 6, '先': 6, '早': 6, '虫': 6, '交': 6,
      '角': 7, '町': 7, '花': 7, '見': 7, '貝': 7, '赤': 7, '足': 7, '車': 7, '男': 7,
      '金': 8, '雨': 8, '命': 8, '青': 8, '林': 8, '空': 8, '知': 8, '長': 8,
      '風': 9, '海': 9, '音': 9, '草': 9, '食': 9, '首': 9, '面': 9, '春': 9, '秋': 9
    };

    // 3. 熟語対応辞書
    const kanjiReadingMap = {
      '人口': 'じんこう',
      '大金': 'たいきん',
      '風水': 'ふうすい',
      '一学生': 'いちがくせい'
    };

    let wordReadings = [];

    // STEP 1 用：1文字入力で自動移動するオートアドバンス
    function setupStep1AutoAdvance(inputs) {
      inputs.forEach((input, index) => {
        input.addEventListener('input', () => {
          if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && input.value === '' && index > 0) {
            inputs[index - 1].focus();
          }
        });
      });
    }

    // STEP 1 セットアップ
    const s1LeftInputs  = Array.from(document.querySelectorAll('.step1-left-in'));
    const s1RightInputs = Array.from(document.querySelectorAll('.step1-right-in'));
    setupStep1AutoAdvance(s1LeftInputs);
    s1LeftInputs.forEach(input => input.addEventListener('input', checkStep1));

    function checkStep1() {
      const vals = s1LeftInputs.map(i => i.value.trim());

      if (vals.some(v => v === "" || isNaN(v))) {
        s1RightInputs.forEach(i => i.value = "");
        document.getElementById('step1-mark').innerText = "⬜";
        updateStrokeHints([]);
        lockStep2();
        return;
      }

      const num1 = parseInt(vals[0] + vals[1]);
      const num2 = parseInt(vals[2] + vals[3]);
      const num3 = parseInt(vals[4] + vals[5]);
      const sum  = num1 + num2 + num3;

      const sumStr = sum.toString().padStart(3, '0');
      
      s1RightInputs[0].value = sumStr[0];
      s1RightInputs[1].value = sumStr[1];
      s1RightInputs[2].value = sumStr[2];

      const allNineDigits = [...vals, sumStr[0], sumStr[1], sumStr[2]];
      updateStrokeHints(allNineDigits);

      document.getElementById('step1-mark').innerText = "✅";
      unlockStep2();
    }

    function updateStrokeHints(digits) {
      const strokeHints = document.querySelectorAll('.stroke-hint');
      strokeHints.forEach((hint, idx) => {
        hint.innerText = digits[idx] ? `${digits[idx]}画` : '-画';
      });
    }

    function unlockStep2() {
      const el = document.getElementById('step2-container');
      if (el) el.classList.remove('opacity-40', 'pointer-events-none');
    }
    function lockStep2() {
      const el = document.getElementById('step2-container');
      if (el) el.classList.add('opacity-40', 'pointer-events-none');
      document.getElementById('step2-mark').innerText = "⬜";
      lockStep3();
    }

    // STEP 2 セットアップ
    const s2Inputs = Array.from(document.querySelectorAll('.step2-word-in'));
    s2Inputs.forEach(input => {
      input.addEventListener('input', checkStep2);
    });

    function getAllStep1Digits() {
      const left  = s1LeftInputs.map(i => i.value.trim());
      const right = s1RightInputs.map(i => i.value.trim());
      return [...left, ...right];
    }

    function checkStep2() {
      const words = s2Inputs.map(i => i.value.trim());
      const msgEl = document.getElementById('step2-msg');
      if (msgEl) msgEl.innerText = "";

      // 4箇所の熟語入力が完成しているかチェック
      if (words.some(w => w === "")) return;

      // 文字数の簡易チェック（2字、2字、2字、3字）
      if (words[0].length !== 2 || words[1].length !== 2 || words[2].length !== 2 || words[3].length !== 3) {
        if (msgEl) msgEl.innerText = "各入力欄に指定された文字数（2字／3字）を入力してください";
        return;
      }

      // 全漢字を1文字ずつの配列に分解
      const kanjis = words.join('').split('');
      const targetDigits = getAllStep1Digits();

      // 画数判定
      for (let i = 0; i < 9; i++) {
        const targetStroke = parseInt(targetDigits[i]);
        const k = kanjis[i];
        const stroke = strokeDict[k];

        if (!stroke) {
          if (msgEl) msgEl.innerText = `「${k}」の画数データが見つかりません`;
          return;
        }
        if (stroke !== targetStroke) {
          if (msgEl) msgEl.innerText = `${i+1}文字目「${k}」は${stroke}画ですが、指定は${targetStroke}画です`;
          return;
        }
      }

      // 熟語辞書チェック
      const r1 = kanjiReadingMap[words[0]];
      const r2 = kanjiReadingMap[words[1]];
      const r3 = kanjiReadingMap[words[2]];
      const r4 = kanjiReadingMap[words[3]];

      if (!r1 || !r2 || !r3 || !r4) {
        if (msgEl) msgEl.innerText = "実在する正しい熟語を入力してください";
        return;
      }

      wordReadings = [r1, r2, r3, r4];

      const mark = document.getElementById('step2-mark');
      if (mark) mark.innerText = "✅";
      unlockStep3();
    }

    // STEP 3 暗号生成 & 最終チェック
    function unlockStep3() {
      const el = document.getElementById('step3-container');
      if (el) el.classList.remove('opacity-40', 'pointer-events-none');

      const plainSpaced  = wordReadings.join(' ');
      const cipherSpaced = wordReadings.map(word => {
        let cipherWord = "";
        for (let char of word) {
          cipherWord += cipherMap[char] || char;
        }
        return cipherWord;
      }).join(' ');

      const hintEl   = document.getElementById('plain-hint');
      const cipherEl = document.getElementById('cipher-output');
      if (hintEl) hintEl.innerText = plainSpaced;
      if (cipherEl) cipherEl.innerText = cipherSpaced;
    }

    function lockStep3() {
      const el = document.getElementById('step3-container');
      if (el) el.classList.add('opacity-40', 'pointer-events-none');
      document.getElementById('step3-mark').innerText = "⬜";
      
      const hintEl   = document.getElementById('plain-hint');
      const cipherEl = document.getElementById('cipher-output');
      if (hintEl) hintEl.innerText = "（STEP 2クリアで表示）";
      if (cipherEl) cipherEl.innerText = "（STEP 2クリアで表示）";
    }

    const submitBtn = document.getElementById('submit-btn');
    if (submitBtn) {
      submitBtn.addEventListener('click', () => {
        const userAns = document.getElementById('final-answer').value.trim();
        
        const targetWord = "こたえ";
        let expectedAnswer = "";
        for (let char of targetWord) {
          expectedAnswer += cipherMap[char] || char;
        }

        if (userAns !== "" && userAns === expectedAnswer) {
          if (typeof confetti === 'function') {
            confetti({
              particleCount: 120,
              spread: 70,
              origin: { y: 0.6 }
            });
          }
          alert("🎉 CLEAR！おめでとうございます！暗号法則の解読成功です！");
        } else {
          alert("❌ 「こたえ」の暗号文が違います。ヒントからルールを推測して変換してください。");
        }
      });
    }
  </script>
</body>
</html>

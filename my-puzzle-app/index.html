<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解錠せよ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #000000;
      color: #4ade80; /* 明るい黄緑 */
      font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
    }

    /* 基本の白マス */
    .square-input {
      background-color: #ffffff !important;
      color: #000000 !important;
      font-weight: 800;
      text-align: center;
      outline: none;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    
    /* ロック中の入力欄 */
    .square-input:disabled {
      background-color: #222222 !important;
      color: #555555 !important;
      cursor: not-allowed;
      border-color: #333333 !important;
      background-image: none !important;
    }

    /* STEP2: 熟語用入力フォーム */
    .kanji-word-input {
      letter-spacing: 0.25em;
      padding-left: 0.25em;
    }

    /* 未入力（値が空）のときだけ区切り線を表示 */
    .kanji-2len:placeholder-shown {
      background: #ffffff linear-gradient(to right, transparent 50%, #e5e7eb 50%, transparent 52%);
    }

    .kanji-3len:placeholder-shown {
      background: #ffffff linear-gradient(to right, 
        transparent 33.33%, 
        #e5e7eb 33.33%, 
        transparent 34.5%, 
        transparent 66.66%, 
        #e5e7eb 66.66%, 
        transparent 67.8%
      );
    }

    /* フェードインアニメーション */
    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Generating... 用の点滅アニメーション */
    .pulse-loading {
      animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* SVG矢印の共通スタイル */
    .outline-arrow-svg {
      fill: #000000;
      stroke: #4ade80;
      stroke-width: 4;
      stroke-linejoin: round;
      stroke-linecap: round;
      display: inline-block;
      vertical-align: middle;
    }

    /* ポップアップのアニメーション */
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in {
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* 熟語ごとの間隔を狭め、絶対に改行させない */
    .cipher-word-spacing {
      word-spacing: 0.5em;
      white-space: nowrap;
    }
  </style>
</head>
<body class="min-h-screen py-4 px-1 sm:py-8 sm:px-4 flex flex-col items-center justify-center relative">

  <!-- リセットボタン (右上のあたり) -->
  <button id="resetBtn" class="absolute top-3 right-3 sm:top-6 sm:right-6 border border-green-500/50 hover:border-green-400 text-green-400 hover:bg-green-500/10 font-mono text-xs sm:text-sm px-2.5 py-1 sm:px-3 sm:py-1.5 rounded transition-all">
    RESET
  </button>

  <main class="w-full max-w-xl space-y-3 sm:space-y-6 border border-green-500/30 p-3 sm:p-8 rounded-lg bg-black relative">
    
    <!-- タイトル -->
    <header class="text-center border-b border-green-500/30 pb-2 sm:pb-4">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-widest text-green-400">解錠せよ</h1>
    </header>

    <div id="puzzleForm" class="space-y-3 sm:space-y-5">

      <!-- STEP 1 -->
      <section>
        <div class="w-full max-w-md mx-auto flex items-center justify-between text-green-400 font-extrabold font-mono text-lg sm:text-2xl py-0.5 sm:py-1 min-w-0">
          <div class="flex gap-1">
            <input type="text" id="d0" maxlength="1" class="square-input w-9 h-11 sm:w-9 sm:h-11 text-xl sm:text-xl rounded border-2 border-green-400" required>
            <input type="text" id="d1" maxlength="1" class="square-input w-9 h-11 sm:w-9 sm:h-11 text-xl sm:text-xl rounded border-2 border-green-400" required>
          </div>
          
          <span class="px-0.5 sm:px-1">+</span>
          
          <div class="flex gap-1">
            <input type="text" id="d2" maxlength="1" class="square-input w-9 h-11 sm:w-9 sm:h-11 text-xl sm:text-xl rounded border-2 border-green-400" required>
            <input type="text" id="d3" maxlength="1" class="square-input w-9 h-11 sm:w-9 sm:h-11 text-xl sm:text-xl rounded border-2 border-green-400" required>
          </div>
          
          <span class="px-0.5 sm:px-1">+</span>
          
          <div class="flex gap-1">
            <input type="text" id="d4" maxlength="1" class="square-input w-9 h-11 sm:w-9 sm:h-11 text-xl sm:text-xl rounded border-2 border-green-400" required>
            <input type="text" id="d5" maxlength="1" class="square-input w-9 h-11 sm:w-9 sm:h-11 text-xl sm:text-xl rounded border-2 border-green-400" required>
          </div>
          
          <span class="px-0.5 sm:px-1">=</span>
          
          <div class="flex gap-1">
            <input type="text" id="d6" class="square-input w-9 h-11 sm:w-9 sm:h-11 text-xl sm:text-xl rounded border-2 border-green-400" readonly tabindex="-1">
            <input type="text" id="d7" class="square-input w-9 h-11 sm:w-9 sm:h-11 text-xl sm:text-xl rounded border-2 border-green-400" readonly tabindex="-1">
            <input type="text" id="d8" class="square-input w-9 h-11 sm:w-9 sm:h-11 text-xl sm:text-xl rounded border-2 border-green-400" readonly tabindex="-1">
          </div>
        </div>
      </section>

      <!-- STEP 2 -->
      <section id="step2Section" class="hidden fade-in">
        <div class="bg-gray-950 border border-green-500/30 p-2 sm:p-4 rounded">
          <div class="w-full max-w-md mx-auto flex items-center justify-between py-0.5 sm:py-1 min-w-0">
            <input type="text" id="w1" maxlength="2" placeholder=" " class="square-input kanji-word-input kanji-2len w-[22%] min-w-0 h-11 sm:h-11 text-lg sm:text-xl border-2 border-green-400 rounded" required>
            <input type="text" id="w2" maxlength="2" placeholder=" " class="square-input kanji-word-input kanji-2len w-[22%] min-w-0 h-11 sm:h-11 text-lg sm:text-xl border-2 border-green-400 rounded" required>
            <input type="text" id="w3" maxlength="2" placeholder=" " class="square-input kanji-word-input kanji-2len w-[22%] min-w-0 h-11 sm:h-11 text-lg sm:text-xl border-2 border-green-400 rounded" required>
            <input type="text" id="w4" maxlength="3" placeholder=" " class="square-input kanji-word-input kanji-3len w-[28%] min-w-0 h-11 sm:h-11 text-lg sm:text-xl border-2 border-green-400 rounded" required>
          </div>
        </div>
      </section>

      <!-- 下矢印 -->
      <div id="arrowDivider" class="hidden text-center -my-1 sm:-my-2 fade-in">
        <svg class="outline-arrow-svg w-6 h-5 sm:w-10 sm:h-8" viewBox="0 0 60 45">
          <polygon points="18,0 42,0 42,22 55,22 30,43 5,22 18,22" />
        </svg>
      </div>

      <!-- STEP 3 -->
      <section id="step3Section" class="hidden space-y-2 sm:space-y-3 fade-in">
        <!-- 暗号文表示エリア -->
        <div class="bg-gray-950 border border-green-500/30 p-3 sm:p-4 rounded text-center overflow-hidden">
          <div id="cipherDisplay" class="text-xs sm:text-base md:text-lg font-mono text-green-300 tracking-wider cipher-word-spacing min-h-[28px] inline-flex items-center justify-center"></div>
        </div>

        <!-- 解錠 ⇨ 入力欄 -->
        <div id="answerSection" class="hidden flex flex-col items-center justify-center gap-2 sm:gap-3 pt-2 sm:pt-4 fade-in">
          <div class="flex items-center justify-center gap-2 sm:gap-3">
            <span class="text-xl sm:text-3xl font-extrabold text-green-400">解錠</span>
            <svg class="outline-arrow-svg w-6 h-5 sm:w-10 sm:h-8" viewBox="0 0 50 36">
              <polygon points="0,10 28,10 28,2 48,18 28,34 28,26 0,26" />
            </svg>
            <input 
              type="text" 
              id="answerInput" 
              class="square-input w-36 sm:w-64 h-11 sm:h-12 text-base sm:text-xl rounded border-2 border-green-400 px-3 tracking-widest font-mono"
              autocomplete="off"
              required
            >
          </div>
        </div>
      </section>

    </div>

  </main>

  <!-- CLEAR表示 (メイン枠の外側に配置) -->
  <div id="inlineClearMessage" class="hidden text-3xl sm:text-4xl font-black text-green-400 tracking-widest pt-4 sm:pt-6 fade-in text-center">
    CLEAR
  </div>

  <!-- 不正解（INCORRECT）ポップアップ -->
  <div id="incorrectModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-950 border-2 border-red-500 rounded-xl p-6 max-w-xs w-full text-center space-y-3 pop-in shadow-[0_0_30px_rgba(239,68,68,0.4)]">
      <h3 class="text-2xl font-black text-red-500 tracking-wider">INCORRECT</h3>
    </div>
  </div>

  <!-- クリア（CLEAR）ポップアップ -->
  <div id="clearModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-950 border-2 border-green-400 rounded-xl p-8 max-w-xs w-full text-center space-y-4 pop-in shadow-[0_0_30px_rgba(74,222,128,0.3)]">
      <div class="text-5xl">🔓</div>
      <h3 class="text-3xl font-black text-green-400 tracking-wider">CLEAR</h3>
    </div>
  </div>

  <script>
    const ALL_HIRAGANA = [
      'あ','い','う','え','お','か','き','く','け','こ',
      'さ','し','す','せ','そ','た','ち','つ','て','と',
      'な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ',
      'ま','み','む','め','も','や','ゆ','よ','ら','り',
      'る','れ','ろ','わ','를'.replace('를','を'),'ん',
      'が','ぎ','ぐ','げ','ご','ざ','じ','ず','ぜ','ぞ',
      'だ','ぢ','づ','で','ど','ば','び','ぶ','べ','ぼ',
      'ぱ','ぴ','ぷ','ぺ','ぽ',
      'ぁ','ぃ','ぅ','ぇ','ぉ','っ','ゃ','ゅ','ょ','ゎ'
    ];

    const LOWER_ALPHABETS = 'abcdefghijklmnopqrstuvwxyz'.split('');
    const SYMBOLS = "!$%&'()*+,/;<=>?[]^{}~".split('');

    let substitutionMap = {};
    let expectedAnswer = "";

    function generateSubstitutionMap() {
      const map = {};
      const usedPairs = new Set();

      for (const char of ALL_HIRAGANA) {
        let pair = '';
        do {
          const alpha = LOWER_ALPHABETS[Math.floor(Math.random() * LOWER_ALPHABETS.length)];
          const symbol = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
          pair = alpha + symbol;
        } while (usedPairs.has(pair));

        usedPairs.add(pair);
        map[char] = pair;
      }

      return map;
    }

    function encryptTextWithMap(text, map) {
      if (!text || !map) return '';
      let encrypted = '';
      for (const char of text) {
        encrypted += map[char] || char;
      }
      return encrypted;
    }

    // ページロード時に暗号変換ルールと解錠キーを生成
    substitutionMap = generateSubstitutionMap();
    expectedAnswer = encryptTextWithMap('かいじょう', substitutionMap);

    const leftInputs = ['d0', 'd1', 'd2', 'd3', 'd4', 'd5'].map(id => document.getElementById(id));
    const rightInputs = ['d6', 'd7', 'd8'].map(id => document.getElementById(id));
    const kanjiInputs = ['w1', 'w2', 'w3', 'w4'].map(id => document.getElementById(id));
    
    const step2Section = document.getElementById('step2Section');
    const arrowDivider = document.getElementById('arrowDivider');
    const step3Section = document.getElementById('step3Section');
    const cipherDisplay = document.getElementById('cipherDisplay');
    const answerSection = document.getElementById('answerSection');
    const answerInput = document.getElementById('answerInput');
    const clearModal = document.getElementById('clearModal');
    const inlineClearMessage = document.getElementById('inlineClearMessage');
    const incorrectModal = document.getElementById('incorrectModal');
    const resetBtn = document.getElementById('resetBtn');

    let currentReadings = null;
    let fetchRequestId = 0;
    let isCleared = false;

    // STEP1: 入力制御
    leftInputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/[^0-9]/g, '');
        if (input.value && index < leftInputs.length - 1) {
          leftInputs[index + 1].focus();
        }
        calculateStep1();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          leftInputs[index - 1].focus();
        }
      });
    });

    function calculateStep1() {
      const vals = leftInputs.map(i => i.value);
      if (vals.every(v => v !== '')) {
        if (vals.includes('0')) {
          rightInputs.forEach(i => i.value = '');
          hideStep2();
          showIncorrectPopup();
          return;
        }

        const sum = parseInt(vals[0] + vals[1], 10) + parseInt(vals[2] + vals[3], 10) + parseInt(vals[4] + vals[5], 10);
        const sumStr = String(sum).padStart(3, '0');
        if (sumStr.length === 3 && !sumStr.includes('0')) {
          rightInputs[0].value = sumStr[0];
          rightInputs[1].value = sumStr[1];
          rightInputs[2].value = sumStr[2];
          showStep2();
          return;
        } else {
          rightInputs.forEach(i => i.value = '');
          hideStep2();
          showIncorrectPopup();
          return;
        }
      }
      rightInputs.forEach(i => i.value = '');
      hideStep2();
    }

    function showStep2() {
      if (step2Section.classList.contains('hidden')) {
        step2Section.classList.remove('hidden');
      }
    }

    function hideStep2() {
      step2Section.classList.add('hidden');
      kanjiInputs.forEach(input => input.value = '');
      hideStep3();
    }

    // STEP2: 漢字入力制御
    kanjiInputs.forEach((input, index) => {
      let isComposing = false;

      input.addEventListener('compositionstart', () => { isComposing = true; });
      input.addEventListener('compositionend', () => {
        isComposing = false;
        checkAndMove();
        updateDisplay();
      });

      input.addEventListener('input', () => {
        if (!isComposing) {
          checkAndMove();
          updateDisplay();
        }
      });

      function checkAndMove() {
        const targetLength = parseInt(input.getAttribute('maxlength'), 10);
        if (input.value.length >= targetLength && index < kanjiInputs.length - 1) {
          kanjiInputs[index + 1].focus();
        }
      }

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          kanjiInputs[index - 1].focus();
        }
      });
    });

    function showStep3() {
      if (arrowDivider.classList.contains('hidden')) {
        arrowDivider.classList.remove('hidden');
      }
      if (step3Section.classList.contains('hidden')) {
        step3Section.classList.remove('hidden');
      }
    }

    function hideStep3() {
      arrowDivider.classList.add('hidden');
      step3Section.classList.add('hidden');
      answerSection.classList.add('hidden');
      inlineClearMessage.classList.add('hidden');
      currentReadings = null;
      answerInput.value = '';
      answerInput.disabled = false;
      cipherDisplay.innerText = '';
      cipherDisplay.classList.remove('pulse-loading');
      isCleared = false;
    }

    function showIncorrectPopup() {
      incorrectModal.classList.remove('hidden');
      setTimeout(() => {
        incorrectModal.classList.add('hidden');
      }, 1000);
    }

    async function updateDisplay() {
      const digits = leftInputs.map(i => i.value).join('') + rightInputs.map(i => i.value).join('');
      const words = kanjiInputs.map(i => i.value.trim());

      const isDigitsComplete = digits.length === 9;
      const isWordsComplete = words.every((w, idx) => w.length === parseInt(kanjiInputs[idx].getAttribute('maxlength'), 10));

      if (!isDigitsComplete || !isWordsComplete) {
        hideStep3();
        return;
      }

      showStep3();
      answerSection.classList.add('hidden');
      inlineClearMessage.classList.add('hidden');
      cipherDisplay.innerText = 'generating...';
      cipherDisplay.className = 'text-xs sm:text-base md:text-lg font-mono text-green-300 tracking-wider cipher-word-spacing min-h-[28px] inline-flex items-center justify-center pulse-loading';

      const currentRequestId = ++fetchRequestId;

      try {
        const res = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ words, targetDigits: digits })
        });

        if (currentRequestId !== fetchRequestId) return;

        const data = await res.json();

        if (data.success && data.readings) {
          currentReadings = data.readings;

          const encryptedWords = currentReadings.map(reading => encryptTextWithMap(reading, substitutionMap));
          
          cipherDisplay.className = 'text-xs sm:text-base md:text-lg font-mono text-green-300 tracking-wider cipher-word-spacing min-h-[28px] inline-flex items-center justify-center';
          cipherDisplay.innerText = encryptedWords.join('   ');
          
          answerSection.classList.remove('hidden');
        } else {
          hideStep3();
          showIncorrectPopup();
        }
      } catch (err) {
        if (currentRequestId === fetchRequestId) {
          hideStep3();
          showIncorrectPopup();
        }
      }
    }

    answerInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        checkAnswer();
      }
    });

    function checkAnswer() {
      if (!expectedAnswer || isCleared) return;
      
      const userInput = answerInput.value.trim();
      if (userInput === expectedAnswer) {
        isCleared = true;
        answerInput.disabled = true;
        
        clearModal.classList.remove('hidden');
        setTimeout(() => {
          clearModal.classList.add('hidden');
        }, 2000);

        inlineClearMessage.classList.remove('hidden');
      } else {
        showIncorrectPopup();
      }
    }

    function initDefaultState() {
      const initialDigits = ['3', '8', '5', '9', '3', '2'];
      initialDigits.forEach((val, idx) => {
        leftInputs[idx].value = val;
      });
      calculateStep1();

      const initialWords = ['子供', '石炭', '大人', '一人前'];
      initialWords.forEach((word, idx) => {
        kanjiInputs[idx].value = word;
      });

      updateDisplay();
    }

    resetBtn.addEventListener('click', () => {
      hideStep3();
      hideStep2();
      leftInputs.forEach(i => i.value = '');
      rightInputs.forEach(i => i.value = '');
      kanjiInputs.forEach(i => i.value = '');
      initDefaultState();
    });

    window.addEventListener('DOMContentLoaded', () => {
      initDefaultState();
    });
  </script>
</body>
</html>

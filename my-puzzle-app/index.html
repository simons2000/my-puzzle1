<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解錠せよ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #000000;
      color: #4ade80; /* 明るい黄緑 */
      font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
    }

    /* 基本の白マス */
    .square-input {
      background-color: #ffffff !important;
      color: #000000 !important;
      font-weight: 800;
      text-align: center;
      outline: none;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    
    /* ロック中の入力欄 */
    .square-input:disabled {
      background-color: #222222 !important;
      color: #555555 !important;
      cursor: not-allowed;
      border-color: #333333 !important;
      background-image: none !important;
    }

    /* STEP2: 熟語用入力フォーム */
    .kanji-word-input {
      letter-spacing: 0.25em;
      padding-left: 0.25em;
    }

    /* 未入力（値が空）のときだけ区切り線を表示 */
    .kanji-2len:placeholder-shown {
      background: #ffffff linear-gradient(to right, transparent 50%, #e5e7eb 50%, transparent 52%);
    }

    .kanji-3len:placeholder-shown {
      background: #ffffff linear-gradient(to right, 
        transparent 33.33%, 
        #e5e7eb 33.33%, 
        transparent 34.5%, 
        transparent 66.66%, 
        #e5e7eb 66.66%, 
        transparent 67.8%
      );
    }

    /* フェードインアニメーション */
    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Generating... 用の点滅アニメーション */
    .pulse-loading {
      animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* 枠線矢印（塗りつぶしなし）共通デザイン */
    .outline-arrow {
      color: transparent;
      -webkit-text-stroke: 2px #4ade80;
      font-weight: 900;
      display: inline-block;
      line-height: 1;
    }
  </style>
</head>
<body class="min-h-screen py-8 px-2 sm:px-4 flex flex-col items-center justify-center">

  <main class="w-full max-w-xl space-y-8 border border-green-500/30 p-5 sm:p-8 rounded-lg bg-black">
    
    <!-- タイトル -->
    <header class="text-center border-b border-green-500/30 pb-4">
      <h1 class="text-3xl font-extrabold tracking-widest text-green-400">解錠せよ</h1>
    </header>

    <form id="puzzleForm" class="space-y-8">

      <!-- STEP 1 (常に表示) -->
      <section class="space-y-4">
        <h2 class="text-base sm:text-lg font-bold text-green-400">STEP1 マスに1~9の数字を入れ、正しい式を作れ</h2>
        
        <div class="w-full max-w-md mx-auto flex items-center justify-between text-green-400 font-extrabold font-mono text-base sm:text-2xl py-2 min-w-0">
          <!-- 語1 (2桁) -->
          <div class="flex gap-1">
            <input type="text" id="d0" maxlength="1" class="square-input w-6 h-8 sm:w-9 sm:h-11 text-base sm:text-xl rounded border-2 border-green-400" required>
            <input type="text" id="d1" maxlength="1" class="square-input w-6 h-8 sm:w-9 sm:h-11 text-base sm:text-xl rounded border-2 border-green-400" required>
          </div>
          
          <span class="px-0.5 sm:px-1">+</span>
          
          <!-- 語2 (2桁) -->
          <div class="flex gap-1">
            <input type="text" id="d2" maxlength="1" class="square-input w-6 h-8 sm:w-9 sm:h-11 text-base sm:text-xl rounded border-2 border-green-400" required>
            <input type="text" id="d3" maxlength="1" class="square-input w-6 h-8 sm:w-9 sm:h-11 text-base sm:text-xl rounded border-2 border-green-400" required>
          </div>
          
          <span class="px-0.5 sm:px-1">+</span>
          
          <!-- 語3 (2桁) -->
          <div class="flex gap-1">
            <input type="text" id="d4" maxlength="1" class="square-input w-6 h-8 sm:w-9 sm:h-11 text-base sm:text-xl rounded border-2 border-green-400" required>
            <input type="text" id="d5" maxlength="1" class="square-input w-6 h-8 sm:w-9 sm:h-11 text-base sm:text-xl rounded border-2 border-green-400" required>
          </div>
          
          <span class="px-0.5 sm:px-1">=</span>
          
          <!-- 語4 (自動計算される3桁) -->
          <div class="flex gap-1">
            <input type="text" id="d6" class="square-input w-6 h-8 sm:w-9 sm:h-11 text-base sm:text-xl rounded border-2 border-green-400" readonly tabindex="-1">
            <input type="text" id="d7" class="square-input w-6 h-8 sm:w-9 sm:h-11 text-base sm:text-xl rounded border-2 border-green-400" readonly tabindex="-1">
            <input type="text" id="d8" class="square-input w-6 h-8 sm:w-9 sm:h-11 text-base sm:text-xl rounded border-2 border-green-400" readonly tabindex="-1">
          </div>
        </div>
      </section>

      <!-- STEP 2 (STEP1クリアまで非表示) -->
      <section id="step2Section" class="hidden space-y-4 pt-4 border-t border-green-500/20 fade-in">
        <h2 class="text-base sm:text-lg font-bold text-green-400">STEP2 マスに正しい漢字を入れ、4つの熟語を作れ</h2>

        <div class="w-full max-w-md mx-auto flex items-center justify-between py-2 min-w-0">
          <input type="text" id="w1" maxlength="2" placeholder=" " class="square-input kanji-word-input kanji-2len w-[20%] min-w-0 h-8 sm:h-11 text-base sm:text-xl border-2 border-green-400 rounded" required>
          <input type="text" id="w2" maxlength="2" placeholder=" " class="square-input kanji-word-input kanji-2len w-[20%] min-w-0 h-8 sm:h-11 text-base sm:text-xl border-2 border-green-400 rounded" required>
          <input type="text" id="w3" maxlength="2" placeholder=" " class="square-input kanji-word-input kanji-2len w-[20%] min-w-0 h-8 sm:h-11 text-base sm:text-xl border-2 border-green-400 rounded" required>
          <input type="text" id="w4" maxlength="3" placeholder=" " class="square-input kanji-word-input kanji-3len w-[31%] min-w-0 h-8 sm:h-11 text-base sm:text-xl border-2 border-green-400 rounded" required>
        </div>
      </section>

      <!-- STEP2 と STEP3 の間の下矢印 (枠線のみ・特大) -->
      <div id="arrowDivider" class="hidden text-center py-2 fade-in">
        <span class="outline-arrow text-4xl sm:text-5xl">⇩</span>
      </div>

      <!-- STEP 3 (STEP2クリア判定開始で表示) -->
      <section id="step3Section" class="hidden space-y-4 fade-in">
        <h2 class="text-base sm:text-lg font-bold text-green-400">STEP3 暗号文を解読し、解錠せよ</h2>

        <!-- 暗号文表示エリア -->
        <div class="bg-gray-950 border border-green-500/30 p-4 rounded text-center space-y-2">
          <p class="text-xs text-green-500/70">【 暗号文 】</p>
          <div id="cipherDisplay" class="text-base sm:text-lg font-mono text-green-300 tracking-wider min-h-[28px] flex items-center justify-center"></div>
        </div>

        <!-- 解錠 ⇨ 入力欄 (枠線のみ・特大の右矢印) -->
        <div class="flex items-center justify-center gap-3 pt-2">
          <span class="text-xl sm:text-2xl font-extrabold text-green-400">解錠</span>
          <span class="outline-arrow text-3xl sm:text-4xl">⇨</span>
          <input 
            type="text" 
            id="answerInput" 
            class="square-input w-48 sm:w-64 h-11 sm:h-12 text-lg sm:text-xl rounded border-2 border-green-400 px-3 tracking-widest font-mono"
            placeholder="暗号化文字列"
            required
          >
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full bg-green-400 hover:bg-green-300 text-black font-extrabold py-3.5 rounded text-lg transition-all active:scale-[0.98] mt-4 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          解錠（判定）
        </button>

        <div id="result" class="hidden rounded p-4 text-center text-sm font-bold border"></div>
      </section>

    </form>
  </main>

  <script>
    const ALL_HIRAGANA = [
      'あ','い','う','え','お','か','き','く','け','こ',
      'さ','し','す','せ','そ','た','ち','つ','て','と',
      'な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ',
      'ま','み','む','め','も','や','ゆ','よ','ら','り',
      'る','れ','ろ','わ','を','ん',
      'が','ぎ','ぐ','げ','ご','ざ','じ','ず','ぜ','ぞ',
      'だ','ぢ','づ','で','ど','ば','び','ぶ','べ','ぼ',
      'ぱ','ぴ','ぷ','ぺ','ぽ',
      'ぁ','ぃ','ぅ','ぇ','ぉ','っ','ゃ','ゅ','ょ','ゎ'
    ];

    const LOWER_ALPHABETS = 'abcdefghijklmnopqrstuvwxyz'.split('');
    const SYMBOLS = "!$%&'()*+,/;<=>?[]^{}~".split('');

    let substitutionMap = {};

    function generateSubstitutionMap() {
      const map = {};
      const usedPairs = new Set();

      for (const char of ALL_HIRAGANA) {
        let pair = '';
        do {
          const alpha = LOWER_ALPHABETS[Math.floor(Math.random() * LOWER_ALPHABETS.length)];
          const symbol = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
          pair = alpha + symbol;
        } while (usedPairs.has(pair));

        usedPairs.add(pair);
        map[char] = pair;
      }

      return map;
    }

    function encryptTextWithMap(text, map) {
      if (!text || !map) return '';
      let encrypted = '';
      for (const char of text) {
        encrypted += map[char] || char;
      }
      return encrypted;
    }

    const leftInputs = ['d0', 'd1', 'd2', 'd3', 'd4', 'd5'].map(id => document.getElementById(id));
    const rightInputs = ['d6', 'd7', 'd8'].map(id => document.getElementById(id));
    const kanjiInputs = ['w1', 'w2', 'w3', 'w4'].map(id => document.getElementById(id));
    
    const step2Section = document.getElementById('step2Section');
    const arrowDivider = document.getElementById('arrowDivider');
    const step3Section = document.getElementById('step3Section');
    const cipherDisplay = document.getElementById('cipherDisplay');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');

    let currentReadings = null;
    let lastCheckedDigits = "";
    let fetchRequestId = 0;

    substitutionMap = generateSubstitutionMap();

    // STEP1: 入力制御（1〜9のみ許可・0不可）
    leftInputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/[^1-9]/g, '');
        if (input.value && index < leftInputs.length - 1) {
          leftInputs[index + 1].focus();
        }
        calculateStep1();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          leftInputs[index - 1].focus();
        }
      });
    });

    function calculateStep1() {
      const vals = leftInputs.map(i => i.value);
      if (vals.every(v => v !== '')) {
        const sum = parseInt(vals[0] + vals[1], 10) + parseInt(vals[2] + vals[3], 10) + parseInt(vals[4] + vals[5], 10);
        const sumStr = String(sum).padStart(3, '0');
        if (sumStr.length === 3) {
          rightInputs[0].value = sumStr[0];
          rightInputs[1].value = sumStr[1];
          rightInputs[2].value = sumStr[2];
          showStep2();
          return;
        }
      }
      rightInputs.forEach(i => i.value = '');
      hideStep2();
    }

    function showStep2() {
      if (step2Section.classList.contains('hidden')) {
        step2Section.classList.remove('hidden');
      }
    }

    function hideStep2() {
      step2Section.classList.add('hidden');
      kanjiInputs.forEach(input => input.value = '');
      hideStep3();
    }

    // STEP2: 漢字入力制御
    kanjiInputs.forEach((input, index) => {
      let isComposing = false;

      input.addEventListener('compositionstart', () => { isComposing = true; });
      input.addEventListener('compositionend', () => {
        isComposing = false;
        checkAndMove();
        updateDisplay();
      });

      input.addEventListener('input', () => {
        if (!isComposing) {
          checkAndMove();
          updateDisplay();
        }
      });

      function checkAndMove() {
        const targetLength = parseInt(input.getAttribute('maxlength'), 10);
        if (input.value.length >= targetLength && index < kanjiInputs.length - 1) {
          kanjiInputs[index + 1].focus();
        }
      }

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          kanjiInputs[index - 1].focus();
        }
      });
    });

    function showStep3() {
      if (arrowDivider.classList.contains('hidden')) {
        arrowDivider.classList.remove('hidden');
      }
      if (step3Section.classList.contains('hidden')) {
        step3Section.classList.remove('hidden');
      }
    }

    function hideStep3() {
      arrowDivider.classList.add('hidden');
      step3Section.classList.add('hidden');
      currentReadings = null;
      answerInput.value = '';
      cipherDisplay.innerText = '';
      cipherDisplay.classList.remove('pulse-loading');
      submitBtn.disabled = false;
    }

    async function updateDisplay() {
      const digits = leftInputs.map(i => i.value).join('') + rightInputs.map(i => i.value).join('');
      const words = kanjiInputs.map(i => i.value.trim());

      const isDigitsComplete = digits.length === 9;
      const isWordsComplete = words.every((w, idx) => w.length === parseInt(kanjiInputs[idx].getAttribute('maxlength'), 10));

      if (!isDigitsComplete || !isWordsComplete) {
        hideStep3();
        return;
      }

      showStep3();
      cipherDisplay.innerText = 'generating...';
      cipherDisplay.classList.add('pulse-loading', 'text-yellow-400');
      cipherDisplay.classList.remove('text-green-300');
      submitBtn.disabled = true;

      const currentRequestId = ++fetchRequestId;

      try {
        const res = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ words, targetDigits: digits })
        });

        if (currentRequestId !== fetchRequestId) return;

        const data = await res.json();

        if (data.success && data.readings) {
          currentReadings = data.readings;
          lastCheckedDigits = digits;

          substitutionMap = generateSubstitutionMap();

          const encryptedWords = currentReadings.map(reading => encryptTextWithMap(reading, substitutionMap));
          
          cipherDisplay.classList.remove('pulse-loading', 'text-yellow-400');
          cipherDisplay.classList.add('text-green-300');
          cipherDisplay.innerText = encryptedWords.join(' ');
          submitBtn.disabled = false;
        } else {
          hideStep3();
        }
      } catch (err) {
        if (currentRequestId === fetchRequestId) {
          hideStep3();
        }
      }
    }

    const form = document.getElementById('puzzleForm');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      resultDiv.classList.add('hidden');
      resultDiv.className = 'hidden rounded p-4 text-center text-sm font-bold border';

      const digits = leftInputs.map(i => i.value).join('') + rightInputs.map(i => i.value).join('');

      if (!currentReadings || digits !== lastCheckedDigits) {
        resultDiv.classList.remove('hidden');
        resultDiv.classList.add('bg-red-950', 'text-red-400', 'border-red-800');
        resultDiv.innerText = 'STEP1およびSTEP2を正しく入力（実在する熟語・画数一致）してから回答してください。';
        return;
      }

      const correctAnswer = encryptTextWithMap('かいじょう', substitutionMap);
      const userInputValue = answerInput.value.trim();

      resultDiv.classList.remove('hidden');

      if (userInputValue === correctAnswer) {
        resultDiv.classList.add('bg-green-400', 'text-black', 'border-green-400');
        resultDiv.innerHTML = `🎉 解錠成功！<br>正解です！`;
      } else {
        resultDiv.classList.add('bg-red-950', 'text-red-400', 'border-red-800');
        resultDiv.innerText = '不正解です。暗号文の置換法則を解読して「かいじょう」に対応する文字列を入力してください。';
      }
    });
  </script>
</body>
</html>

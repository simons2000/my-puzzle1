<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解錠せよ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #000000;
      color: #facc15;
      font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
    }

    /* 基本の白マス */
    .square-input {
      background-color: #ffffff !important;
      color: #000000 !important;
      font-weight: 800;
      text-align: center;
      outline: none;
      transition: all 0.2s;
    }
    
    /* ロック中の入力欄 */
    .square-input:disabled {
      background-color: #333333 !important;
      color: #666666 !important;
      cursor: not-allowed;
      border-color: #444444 !important;
      background-image: none !important;
    }

    /* STEP2: 熟語用入力フォーム */
    .kanji-word-input {
      letter-spacing: 0.35em;
      padding-left: 0.35em;
    }

    /* 未入力（値が空）のときだけ区切り線を表示 */
    .kanji-2len:placeholder-shown {
      background: #ffffff linear-gradient(to right, transparent 50%, #e5e7eb 50%, transparent 52%);
    }

    .kanji-3len:placeholder-shown {
      background: #ffffff linear-gradient(to right, 
        transparent 33.33%, 
        #e5e7eb 33.33%, 
        transparent 34.5%, 
        transparent 66.66%, 
        #e5e7eb 66.66%, 
        transparent 67.8%
      );
    }
  </style>
</head>
<body class="min-h-screen py-8 px-2 sm:px-4 flex flex-col items-center justify-center">

  <main class="w-full max-w-xl space-y-8 border border-yellow-500/30 p-5 sm:p-8 rounded-lg bg-black">
    
    <!-- タイトル -->
    <header class="text-center border-b border-yellow-500/30 pb-4">
      <h1 class="text-3xl font-extrabold tracking-widest text-yellow-400">解錠せよ</h1>
    </header>

    <form id="puzzleForm" class="space-y-8">

      <!-- STEP 1 -->
      <section class="space-y-4">
        <h2 class="text-base sm:text-lg font-bold text-yellow-400">STEP1 マスに0~9の数字を入れ、正しい式を作れ</h2>
        
        <div class="flex items-center justify-center gap-1 sm:gap-2 text-yellow-400 font-extrabold font-mono text-base sm:text-2xl overflow-x-auto py-2">
          <!-- 語1 (2桁) -->
          <div class="flex gap-1">
            <input type="text" id="d0" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" required>
            <input type="text" id="d1" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" required>
          </div>
          
          <span class="px-0.5">+</span>
          
          <!-- 語2 (2桁) -->
          <div class="flex gap-1">
            <input type="text" id="d2" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" required>
            <input type="text" id="d3" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" required>
          </div>
          
          <span class="px-0.5">+</span>
          
          <!-- 語3 (2桁) -->
          <div class="flex gap-1">
            <input type="text" id="d4" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" required>
            <input type="text" id="d5" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" required>
          </div>
          
          <span class="px-0.5">=</span>
          
          <!-- 語4 (自動計算される3桁) -->
          <div class="flex gap-1">
            <input type="text" id="d6" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" readonly tabindex="-1">
            <input type="text" id="d7" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" readonly tabindex="-1">
            <input type="text" id="d8" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl rounded border-2 border-yellow-400" readonly tabindex="-1">
          </div>
        </div>
      </section>

      <!-- STEP 2 -->
      <section id="step2Section" class="space-y-4 opacity-50 pointer-events-none transition-all">
        <div class="flex items-center justify-between">
          <h2 class="text-base sm:text-lg font-bold text-yellow-400">STEP2 マスに正しい漢字を入れ、4つの熟語を作れ</h2>
          <span id="step2LockMsg" class="text-xs text-red-400 font-normal">※STEP1を完成させてください</span>
        </div>

        <div class="flex items-center justify-center gap-2 sm:gap-4 overflow-x-auto py-2">
          <!-- 熟語1 (2文字) -->
          <input type="text" id="w1" maxlength="2" placeholder=" " class="square-input kanji-word-input kanji-2len w-16 h-9 sm:w-20 sm:h-12 text-base sm:text-xl border-2 border-yellow-400 rounded" disabled required>

          <!-- 熟語2 (2文字) -->
          <input type="text" id="w2" maxlength="2" placeholder=" " class="square-input kanji-word-input kanji-2len w-16 h-9 sm:w-20 sm:h-12 text-base sm:text-xl border-2 border-yellow-400 rounded" disabled required>

          <!-- 熟語3 (2文字) -->
          <input type="text" id="w3" maxlength="2" placeholder=" " class="square-input kanji-word-input kanji-2len w-16 h-9 sm:w-20 sm:h-12 text-base sm:text-xl border-2 border-yellow-400 rounded" disabled required>

          <!-- 熟語4 (3文字) -->
          <input type="text" id="w4" maxlength="3" placeholder=" " class="square-input kanji-word-input kanji-3len w-24 h-9 sm:w-28 sm:h-12 text-base sm:text-xl border-2 border-yellow-400 rounded" disabled required>
        </div>
      </section>

      <!-- STEP 3 -->
      <section class="space-y-4">
        <h2 class="text-base sm:text-lg font-bold text-yellow-400">STEP3 暗号文を解読し、解錠せよ</h2>

        <!-- 暗号文表示エリア -->
        <div class="bg-gray-950 border border-yellow-500/30 p-4 rounded text-center space-y-2">
          <p class="text-xs text-yellow-500/70">【 暗号文 】</p>
          <div id="cipherDisplay" class="text-base sm:text-lg font-mono text-yellow-300 tracking-wider">
            ※STEP1・2を正しく入力すると暗号文が現れます
          </div>
        </div>

        <!-- 解錠 ＝ 入力欄 -->
        <div class="flex items-center justify-center gap-3 pt-2">
          <span class="text-xl sm:text-2xl font-extrabold text-yellow-400">解錠 ＝</span>
          <input 
            type="text" 
            id="answerInput" 
            class="square-input w-48 sm:w-64 h-11 sm:h-12 text-lg sm:text-xl rounded border-2 border-yellow-400 px-3 tracking-widest"
            placeholder="暗号化文字列"
            required
          >
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-extrabold py-3.5 rounded text-lg transition-all active:scale-[0.98] mt-4"
        >
          解錠（判定）
        </button>

        <div id="result" class="hidden rounded p-4 text-center text-sm font-bold border"></div>
      </section>

    </form>
  </main>

  <script>
    // 漢字の画数データベース（主要漢字および入力想定漢字）
    const STROKE_COUNT_MAP = {
      '人': 2, '口': 3, '大': 3, '金': 8, '合': 6, '一': 1, '本': 5, '気': 6,
      '事': 8, '少': 4, '年': 6, '怪': 8, '前': 9, '手': 4, '目': 5, '耳': 6,
      '心': 4, '力': 2, '水': 4, '火': 4, '木': 4, '土': 3, '日': 4, '月': 4
    };

    // 読み辞書（標準的なひらがな読み）
    const DYNAMIC_READING_MAP = {
      '人口': 'じんこう',
      '大金': 'たいきん',
      '合金': 'ごうきん',
      '一人前': 'いちにんまえ',
      '人事': 'じんじ',
      '少年': 'しょうねん',
      '怪人': 'かいじん',
      '一本気': 'いっぽんぎ'
    };

    // 五十音表（行シフト用）
    const GOJUON_TABLE = [
      ['あ', 'い', 'う', 'え', 'お'],
      ['か', 'き', 'く', 'け', 'こ'],
      ['さ', 'し', 'す', 'せ', 'そ'],
      ['た', 'ち', 'つ', 'て', 'と'],
      ['な', 'に', 'ぬ', 'ね', 'の'],
      ['は', 'ひ', 'ふ', 'へ', 'ほ'],
      ['ま', 'み', 'む', 'め', 'も'],
      ['や', 'い', 'ゆ', 'え', 'よ'],
      ['ら', 'り', 'る', 'れ', 'ろ'],
      ['わ', 'い', 'う', 'え', 'を']
    ];

    const DAKUTEN_MAP = {
      'が':'か','ぎ':'き','ぐ':'く','げ':'け','ご':'こ',
      'ざ':'さ','じ':'し','ず':'す','ぜ':'せ','ぞ':'そ',
      'だ':'た','ぢ':'ち','づ':'つ','で':'て','ど':'と',
      'ば':'は','び':'ひ','ぶ':'ふ','べ':'へ','ぼ':'ほ',
      'ぱ':'は','ぴ':'ひ','ぷ':'ふ','ぺ':'へ','ぽ':'ほ'
    };

    const DAKUTEN_REVERSE = {
      'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご',
      'さ':'ざ','し':'じ','す':'ず','せ':'ぜ','ぞ':'そ',
      'た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど',
      'は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'
    };

    // DOM要素
    const leftInputs = ['d0', 'd1', 'd2', 'd3', 'd4', 'd5'].map(id => document.getElementById(id));
    const rightInputs = ['d6', 'd7', 'd8'].map(id => document.getElementById(id));
    const kanjiInputs = ['w1', 'w2', 'w3', 'w4'].map(id => document.getElementById(id));
    const step2Section = document.getElementById('step2Section');
    const step2LockMsg = document.getElementById('step2LockMsg');
    const cipherDisplay = document.getElementById('cipherDisplay');
    const answerInput = document.getElementById('answerInput');

    leftInputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/[^0-9]/g, '');
        if (input.value && index < leftInputs.length - 1) {
          leftInputs[index + 1].focus();
        }
        calculateStep1();
        updateDisplay();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          leftInputs[index - 1].focus();
        }
      });
    });

    function calculateStep1() {
      const vals = leftInputs.map(i => i.value);
      if (vals.every(v => v !== '')) {
        const sum = parseInt(vals[0] + vals[1], 10) + parseInt(vals[2] + vals[3], 10) + parseInt(vals[4] + vals[5], 10);
        const sumStr = String(sum).padStart(3, '0');
        if (sumStr.length === 3) {
          rightInputs[0].value = sumStr[0];
          rightInputs[1].value = sumStr[1];
          rightInputs[2].value = sumStr[2];
          unlockStep2();
          return;
        }
      }
      rightInputs.forEach(i => i.value = '');
      lockStep2();
    }

    function unlockStep2() {
      step2Section.classList.remove('opacity-50', 'pointer-events-none');
      step2LockMsg.classList.add('hidden');
      kanjiInputs.forEach(input => input.disabled = false);
    }

    function lockStep2() {
      step2Section.classList.add('opacity-50', 'pointer-events-none');
      step2LockMsg.classList.remove('hidden');
      kanjiInputs.forEach(input => {
        input.disabled = true;
        input.value = '';
      });
    }

    kanjiInputs.forEach((input, index) => {
      let isComposing = false;

      input.addEventListener('compositionstart', () => { isComposing = true; });
      input.addEventListener('compositionend', () => {
        isComposing = false;
        checkAndMove();
        updateDisplay();
      });

      input.addEventListener('input', () => {
        if (!isComposing) {
          checkAndMove();
          updateDisplay();
        }
      });

      function checkAndMove() {
        const targetLength = parseInt(input.getAttribute('maxlength'), 10);
        if (input.value.length >= targetLength && index < kanjiInputs.length - 1) {
          kanjiInputs[index + 1].focus();
        }
      }

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          kanjiInputs[index - 1].focus();
        }
      });
    });

    // 漢字文字列の総画数を判定
    function getWordStrokes(word) {
      let total = 0;
      for (const char of word) {
        if (STROKE_COUNT_MAP[char] !== undefined) {
          total += STROKE_COUNT_MAP[char];
        } else {
          return null; // 画数未登録の場合
        }
      }
      return total;
    }

    function encryptChar(char, shift) {
      if (char === 'ん') return 'ん';
      
      let isDakuten = false;
      let baseChar = char.normalize('NFKC');

      if (DAKUTEN_MAP[baseChar]) {
        isDakuten = true;
        baseChar = DAKUTEN_MAP[baseChar];
      }

      const smallToBig = {'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','ゃ':'や','ゅ':'ゆ','ょ':'よ','っ':'つ'};
      if (smallToBig[baseChar]) baseChar = smallToBig[baseChar];

      let currentGyou = -1;
      let currentDan = -1;

      for (let g = 0; g < GOJUON_TABLE.length; g++) {
        for (let d = 0; d < 5; d++) {
          if (GOJUON_TABLE[g][d] === baseChar) {
            currentGyou = g;
            currentDan = d;
            break;
          }
        }
        if (currentGyou !== -1) break;
      }

      if (currentGyou === -1) return char;

      const newGyou = (currentGyou + shift) % GOJUON_TABLE.length;
      let newChar = GOJUON_TABLE[newGyou][currentDan];

      if (isDakuten && DAKUTEN_REVERSE[newChar]) {
        newChar = DAKUTEN_REVERSE[newChar];
      }

      return newChar;
    }

    function encryptText(text, digits) {
      if (!text || !digits) return '';
      const shift = parseInt(digits[0] || '1', 10);
      return text.split('').map(c => encryptChar(c, shift)).join('');
    }

    // 画数・文字数および数字条件に一致しているか判定
    function getInputsState() {
      const digits = leftInputs.map(i => i.value).join('') + rightInputs.map(i => i.value).join('');
      const words = kanjiInputs.map(i => i.value.trim());

      if (digits.length < 9) return null;

      // STEP1の各項の数値を取得 (例: 28, 46, 82)
      const targetStrokes = [
        parseInt(leftInputs[0].value + leftInputs[1].value, 10),
        parseInt(leftInputs[2].value + leftInputs[3].value, 10),
        parseInt(leftInputs[4].value + leftInputs[5].value, 10),
        parseInt(rightInputs[0].value + rightInputs[1].value + rightInputs[2].value, 10)
      ];

      // 各熟語の画数計算と一致確認
      for (let i = 0; i < 4; i++) {
        const word = words[i];
        if (!word) return null;

        const strokes = getWordStrokes(word);
        if (strokes === null || strokes !== targetStrokes[i]) {
          return null;
        }
      }

      return { digits, words };
    }

    function updateDisplay() {
      const state = getInputsState();
      if (!state) {
        cipherDisplay.innerText = '※STEP1・2を正しく入力すると暗号文が現れます';
        return;
      }

      const encryptedWords = state.words.map(word => {
        const reading = DYNAMIC_READING_MAP[word] || word;
        return encryptText(reading, state.digits);
      });

      cipherDisplay.innerText = encryptedWords.join(' ');
    }

    // 判定処理
    const form = document.getElementById('puzzleForm');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      resultDiv.classList.add('hidden');
      resultDiv.className = 'hidden rounded p-4 text-center text-sm font-bold border';

      const state = getInputsState();
      if (!state) {
        resultDiv.classList.remove('hidden');
        resultDiv.classList.add('bg-red-950', 'text-red-400', 'border-red-800');
        resultDiv.innerText = 'STEP1の数字とSTEP2の熟語（画数・文字数）が正しく対応していません。';
        return;
      }

      const correctAnswerBase = encryptText('かいじょう', state.digits);
      const userInputValue = answerInput.value.trim();

      const validAnswers = [
        correctAnswerBase,
        correctAnswerBase.replace(/お$/, 'よう'),
        'きいちろお',
        'きいちろよう',
        'きぢろく'
      ];

      resultDiv.classList.remove('hidden');

      if (validAnswers.includes(userInputValue)) {
        resultDiv.classList.add('bg-yellow-400', 'text-black', 'border-yellow-400');
        resultDiv.innerHTML = `🎉 解錠成功！<br>正解です！`;
      } else {
        resultDiv.classList.add('bg-red-950', 'text-red-400', 'border-red-800');
        resultDiv.innerText = '不正解です。「かいじょう」を正しく暗号化した文字列を入力してください。';
      }
    });
  </script>
</body>
</html>

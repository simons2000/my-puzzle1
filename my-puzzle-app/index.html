<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暗号パズル</title>
  <!-- スタイリッシュなダークモード用のフォントとTailwind CSSを読み込み -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-md bg-[#111827] rounded-2xl p-6 shadow-2xl border border-gray-800 space-y-6">
    <!-- タイトル -->
    <header class="text-center space-y-1">
      <h1 class="text-xl font-bold tracking-widest text-amber-500 uppercase">Cipher Puzzle</h1>
      <p class="text-xs text-gray-400">画数から熟語を導き出せ</p>
    </header>

    <!-- STEP 1 & STEP 2 入力エリア -->
    <form id="puzzleForm" class="space-y-6">
      <!-- 目標画数ヒント -->
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-gray-400 tracking-wider">TARGET STROKES (9桁)</label>
        <input 
          type="text" 
          id="targetDigits" 
          placeholder="例: 123456789" 
          maxlength="9"
          required
          class="w-full bg-[#1f2937] text-amber-400 font-mono text-center text-lg tracking-widest py-3 px-4 rounded-xl border border-gray-700 focus:outline-none focus:border-amber-500 transition-all placeholder-gray-600"
        >
      </div>

      <!-- 4つの熟語入力 -->
      <div class="space-y-3">
        <label class="block text-xs font-semibold text-gray-400 tracking-wider">WORDS (4つの熟語 / 計9文字)</label>
        <div class="grid grid-cols-2 gap-3">
          <input type="text" id="word1" placeholder="1つ目" required class="bg-[#1f2937] text-white text-center py-2.5 rounded-xl border border-gray-700 focus:outline-none focus:border-amber-500 transition-all placeholder-gray-600">
          <input type="text" id="word2" placeholder="2つ目" required class="bg-[#1f2937] text-white text-center py-2.5 rounded-xl border border-gray-700 focus:outline-none focus:border-amber-500 transition-all placeholder-gray-600">
          <input type="text" id="word3" placeholder="3つ目" required class="bg-[#1f2937] text-white text-center py-2.5 rounded-xl border border-gray-700 focus:outline-none focus:border-amber-500 transition-all placeholder-gray-600">
          <input type="text" id="word4" placeholder="4つ目" required class="bg-[#1f2937] text-white text-center py-2.5 rounded-xl border border-gray-700 focus:outline-none focus:border-amber-500 transition-all placeholder-gray-600">
        </div>
      </div>

      <!-- 送信ボタン -->
      <button 
        type="submit" 
        id="submitBtn"
        class="w-full bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold py-3 rounded-xl transition-all active:scale-[0.98] shadow-lg shadow-amber-500/10"
      >
        判定する
      </button>
    </form>

    <!-- 結果表示エリア -->
    <div id="result" class="hidden rounded-xl p-4 text-center text-sm font-medium transition-all"></div>
  </main>

  <script>
    const form = document.getElementById('puzzleForm');
    const resultDiv = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // UIの初期化
      resultDiv.classList.add('hidden');
      resultDiv.className = 'hidden rounded-xl p-4 text-center text-sm font-medium transition-all';
      submitBtn.disabled = true;
      submitBtn.innerText = '検証中...';

      const targetDigits = document.getElementById('targetDigits').value.trim();
      const words = [
        document.getElementById('word1').value.trim(),
        document.getElementById('word2').value.trim(),
        document.getElementById('word3').value.trim(),
        document.getElementById('word4').value.trim()
      ];

      try {
        const response = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ targetDigits, words })
        });

        const data = await response.json();

        resultDiv.classList.remove('hidden');

        if (data.success) {
          resultDiv.classList.add('bg-emerald-950/80', 'text-emerald-400', 'border', 'border-emerald-800');
          resultDiv.innerHTML = `
            <p class="font-bold text-base mb-1">🎉 CLEAR!</p>
            <p>読み: ${data.readings.join(' / ')}</p>
          `;
        } else {
          resultDiv.classList.add('bg-rose-950/80', 'text-rose-400', 'border', 'border-rose-800');
          resultDiv.innerText = data.error || 'エラーが発生しました。';
        }
      } catch (err) {
        resultDiv.classList.remove('hidden');
        resultDiv.classList.add('bg-rose-950/80', 'text-rose-400', 'border', 'border-rose-800');
        resultDiv.innerText = '通信エラーが発生しました。';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '判定する';
      }
    });
  </script>
</body>
</html>

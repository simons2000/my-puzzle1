<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解錠せよ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
    }
    /* 白マス（入力ボックス）の共通スタイル */
    .square-input {
      background-color: #ffffff !important;
      color: #000000 !important;
      border: 2px solid #ffffff;
      border-radius: 4px;
      font-weight: bold;
      text-align: center;
      outline: none;
    }
    .square-input:focus {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body class="min-h-screen py-10 px-4 flex flex-col items-center justify-center">

  <main class="w-full max-w-lg space-y-10 border border-gray-800 p-6 sm:p-8 rounded-lg bg-black">
    
    <!-- タイトル -->
    <header class="text-center border-b border-gray-800 pb-4">
      <h1 class="text-3xl font-extrabold tracking-widest">解錠せよ</h1>
    </header>

    <form id="puzzleForm" class="space-y-10">

      <!-- STEP 1 -->
      <section class="space-y-4">
        <h2 class="text-lg font-bold">STEP1 マスに0~9の数字を入れ、正しい式にせよ</h2>
        
        <!-- 方程式レイアウト: [ ] [ ] + [ ] [ ] + [ ] [ ] = [ ] [ ] [ ] -->
        <div class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 text-xl font-bold font-mono">
          <!-- 語1 (2桁) -->
          <input type="text" id="d0" maxlength="1" class="square-input w-8 h-10 sm:w-10 sm:h-12 text-lg sm:text-xl" required>
          <input type="text" id="d1" maxlength="1" class="square-input w-8 h-10 sm:w-10 sm:h-12 text-lg sm:text-xl" required>
          
          <span>+</span>
          
          <!-- 語2 (2桁) -->
          <input type="text" id="d2" maxlength="1" class="square-input w-8 h-10 sm:w-10 sm:h-12 text-lg sm:text-xl" required>
          <input type="text" id="d3" maxlength="1" class="square-input w-8 h-10 sm:w-10 sm:h-12 text-lg sm:text-xl" required>
          
          <span>+</span>
          
          <!-- 語3 (2桁) -->
          <input type="text" id="d4" maxlength="1" class="square-input w-8 h-10 sm:w-10 sm:h-12 text-lg sm:text-xl" required>
          <input type="text" id="d5" maxlength="1" class="square-input w-8 h-10 sm:w-10 sm:h-12 text-lg sm:text-xl" required>
          
          <span>=</span>
          
          <!-- 語4 (3桁) -->
          <input type="text" id="d6" maxlength="1" class="square-input w-8 h-10 sm:w-10 sm:h-12 text-lg sm:text-xl" required>
          <input type="text" id="d7" maxlength="1" class="square-input w-8 h-10 sm:w-10 sm:h-12 text-lg sm:text-xl" required>
          <input type="text" id="d8" maxlength="1" class="square-input w-8 h-10 sm:w-10 sm:h-12 text-lg sm:text-xl" required>
        </div>
      </section>

      <!-- STEP 2 -->
      <section class="space-y-4">
        <h2 class="text-lg font-bold">STEP2 マスに漢字を入れて、4つの熟語を作れ</h2>

        <div class="grid grid-cols-2 gap-4">
          <!-- 熟語1 (2文字) -->
          <div class="flex items-center justify-center space-x-1">
            <input type="text" id="w1_1" maxlength="1" placeholder="漢" class="square-input w-10 h-12 text-xl" required>
            <input type="text" id="w1_2" maxlength="1" placeholder="字" class="square-input w-10 h-12 text-xl" required>
          </div>

          <!-- 熟語2 (2文字) -->
          <div class="flex items-center justify-center space-x-1">
            <input type="text" id="w2_1" maxlength="1" placeholder="漢" class="square-input w-10 h-12 text-xl" required>
            <input type="text" id="w2_2" maxlength="1" placeholder="字" class="square-input w-10 h-12 text-xl" required>
          </div>

          <!-- 熟語3 (2文字) -->
          <div class="flex items-center justify-center space-x-1">
            <input type="text" id="w3_1" maxlength="1" placeholder="漢" class="square-input w-10 h-12 text-xl" required>
            <input type="text" id="w3_2" maxlength="1" placeholder="字" class="square-input w-10 h-12 text-xl" required>
          </div>

          <!-- 熟語4 (3文字) -->
          <div class="flex items-center justify-center space-x-1">
            <input type="text" id="w4_1" maxlength="1" placeholder="漢" class="square-input w-10 h-12 text-xl" required>
            <input type="text" id="w4_2" maxlength="1" placeholder="字" class="square-input w-10 h-12 text-xl" required>
            <input type="text" id="w4_3" maxlength="1" placeholder="字" class="square-input w-10 h-12 text-xl" required>
          </div>
        </div>
      </section>

      <!-- STEP 3 -->
      <section class="space-y-4">
        <h2 class="text-lg font-bold">STEP3 正しいパスワードを入れ、解錠せよ</h2>

        <div class="bg-gray-900 border border-gray-700 p-4 rounded text-center space-y-2">
          <p class="text-xs text-gray-400">暗号文</p>
          <div id="cipherDisplay" class="text-sm font-mono text-gray-300">
            [STEP1・2の入力完了後に読みが表示されます]
          </div>
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full bg-white hover:bg-gray-200 text-black font-extrabold py-3.5 rounded text-lg transition-all active:scale-[0.98]"
        >
          解錠（判定）
        </button>

        <!-- 結果表示 -->
        <div id="result" class="hidden rounded p-4 text-center text-sm font-bold border"></div>
      </section>

    </form>
  </main>

  <script>
    // 自動フォーカス移動（数字入力マス）
    const digitInputs = Array.from({length: 9}, (_, i) => document.getElementById(`d${i}`));
    digitInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        // 半角数字のみ許可
        input.value = input.value.replace(/[^0-9]/g, '');
        if (input.value && index < 8) {
          digitInputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          digitInputs[index - 1].focus();
        }
      });
    });

    // 送信・検証処理
    const form = document.getElementById('puzzleForm');
    const resultDiv = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');
    const cipherDisplay = document.getElementById('cipherDisplay');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      resultDiv.classList.add('hidden');
      resultDiv.className = 'hidden rounded p-4 text-center text-sm font-bold border';
      submitBtn.disabled = true;
      submitBtn.innerText = '検証中...';

      // 1. 数字の結合 (9桁)
      const targetDigits = digitInputs.map(i => i.value.trim()).join('');

      // 2. 熟語の結合 (4つ)
      const words = [
        document.getElementById('w1_1').value.trim() + document.getElementById('w1_2').value.trim(),
        document.getElementById('w2_1').value.trim() + document.getElementById('w2_2').value.trim(),
        document.getElementById('w3_1').value.trim() + document.getElementById('w3_2').value.trim(),
        document.getElementById('w4_1').value.trim() + document.getElementById('w4_2').value.trim() + document.getElementById('w4_3').value.trim()
      ];

      try {
        const response = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ targetDigits, words })
        });

        const data = await response.json();
        resultDiv.classList.remove('hidden');

        if (data.success) {
          resultDiv.classList.add('bg-white', 'text-black', 'border-white');
          resultDiv.innerHTML = `🎉 解錠成功！<br>正解です！`;
          cipherDisplay.innerText = `解錠鍵: ${data.readings.join(' / ')}`;
        } else {
          resultDiv.classList.add('bg-red-950', 'text-red-400', 'border-red-800');
          resultDiv.innerText = data.error || '解錠に失敗しました。';
        }
      } catch (err) {
        resultDiv.classList.remove('hidden');
        resultDiv.classList.add('bg-red-950', 'text-red-400', 'border-red-800');
        resultDiv.innerText = '通信エラーが発生しました。';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '解錠（判定）';
      }
    });
  </script>
</body>
</html>

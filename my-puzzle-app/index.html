<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>解錠せよ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #000000;
      color: #facc15; /* 基本文字色：黄色 */
      font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
    }
    /* 白マス（入力ボックス）の共通スタイル */
    .square-input {
      background-color: #ffffff !important;
      color: #f59e0b !important; /* 入力文字：アンバーイエロー */
      border: 2px solid #facc15;
      border-radius: 4px;
      font-weight: font-extrabold;
      text-align: center;
      outline: none;
    }
    .square-input:focus {
      box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.6);
    }
  </style>
</head>
<body class="min-h-screen py-8 px-2 sm:px-4 flex flex-col items-center justify-center">

  <main class="w-full max-w-xl space-y-8 border border-yellow-500/30 p-5 sm:p-8 rounded-lg bg-black">
    
    <!-- タイトル -->
    <header class="text-center border-b border-yellow-500/30 pb-4">
      <h1 class="text-3xl font-extrabold tracking-widest text-yellow-400">解錠せよ</h1>
    </header>

    <form id="puzzleForm" class="space-y-8">

      <!-- STEP 1 -->
      <section class="space-y-4">
        <h2 class="text-base sm:text-lg font-bold text-yellow-400">STEP1 マスに0~9の数字を入れ、正しい式を作れ</h2>
        
        <!-- 数式を横一列に配置（画面幅に合わせて自動調整） -->
        <div class="flex items-center justify-center gap-1 sm:gap-2 text-yellow-400 font-extrabold font-mono text-base sm:text-2xl overflow-x-auto py-2">
          <!-- 語1 (2桁) -->
          <div class="flex gap-1">
            <input type="text" id="d0" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
            <input type="text" id="d1" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
          </div>
          
          <span class="px-0.5">+</span>
          
          <!-- 語2 (2桁) -->
          <div class="flex gap-1">
            <input type="text" id="d2" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
            <input type="text" id="d3" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
          </div>
          
          <span class="px-0.5">+</span>
          
          <!-- 語3 (2桁) -->
          <div class="flex gap-1">
            <input type="text" id="d4" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
            <input type="text" id="d5" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
          </div>
          
          <span class="px-0.5">=</span>
          
          <!-- 語4 (3桁) -->
          <div class="flex gap-1">
            <input type="text" id="d6" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
            <input type="text" id="d7" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
            <input type="text" id="d8" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
          </div>
        </div>
      </section>

      <!-- STEP 2 -->
      <section class="space-y-4">
        <h2 class="text-base sm:text-lg font-bold text-yellow-400">STEP2 マスに正しい漢字を入れ、4つの熟語を作れ</h2>

        <!-- 9個の漢字マスを横一列に配置（熟語ごとに少し間隔を開ける） -->
        <div class="flex items-center justify-center gap-2 sm:gap-4 overflow-x-auto py-2">
          <!-- 熟語1 (2文字) -->
          <div class="flex gap-1">
            <input type="text" id="w1_1" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
            <input type="text" id="w1_2" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
          </div>

          <!-- 熟語2 (2文字) -->
          <div class="flex gap-1">
            <input type="text" id="w2_1" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
            <input type="text" id="w2_2" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
          </div>

          <!-- 熟語3 (2文字) -->
          <div class="flex gap-1">
            <input type="text" id="w3_1" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
            <input type="text" id="w3_2" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
          </div>

          <!-- 熟語4 (3文字) -->
          <div class="flex gap-1">
            <input type="text" id="w4_1" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
            <input type="text" id="w4_2" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
            <input type="text" id="w4_3" maxlength="1" class="square-input w-7 h-9 sm:w-10 sm:h-12 text-base sm:text-xl" required>
          </div>
        </div>
      </section>

      <!-- STEP 3 -->
      <section class="space-y-4">
        <h2 class="text-base sm:text-lg font-bold text-yellow-400">STEP3 正しいパスワードを入れ、解錠せよ</h2>

        <div class="bg-gray-950 border border-yellow-500/30 p-4 rounded text-center space-y-2">
          <p class="text-xs text-yellow-500/70">暗号文</p>
          <div id="cipherDisplay" class="text-sm font-mono text-yellow-300">
            [STEP1・2の入力完了後に読みが表示されます]
          </div>
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-extrabold py-3.5 rounded text-lg transition-all active:scale-[0.98]"
        >
          解錠（判定）
        </button>

        <!-- 結果表示 -->
        <div id="result" class="hidden rounded p-4 text-center text-sm font-bold border"></div>
      </section>

    </form>
  </main>

  <script>
    // 自動フォーカス移動（数字入力マス）
    const digitInputs = Array.from({length: 9}, (_, i) => document.getElementById(`d${i}`));
    digitInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        input.value = input.value.replace(/[^0-9]/g, '');
        if (input.value && index < 8) {
          digitInputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          digitInputs[index - 1].focus();
        }
      });
    });

    // 漢字マスの自動フォーカス移動
    const kanjiInputIds = ['w1_1', 'w1_2', 'w2_1', 'w2_2', 'w3_1', 'w3_2', 'w4_1', 'w4_2', 'w4_3'];
    const kanjiInputs = kanjiInputIds.map(id => document.getElementById(id));
    kanjiInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (input.value && index < kanjiInputs.length - 1) {
          kanjiInputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          kanjiInputs[index - 1].focus();
        }
      });
    });

    // 送信・検証処理
    const form = document.getElementById('puzzleForm');
    const resultDiv = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');
    const cipherDisplay = document.getElementById('cipherDisplay');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      resultDiv.classList.add('hidden');
      resultDiv.className = 'hidden rounded p-4 text-center text-sm font-bold border';
      submitBtn.disabled = true;
      submitBtn.innerText = '検証中...';

      // 1. 数字の結合 (9桁)
      const targetDigits = digitInputs.map(i => i.value.trim()).join('');

      // 2. 熟語の結合 (4つ)
      const words = [
        document.getElementById('w1_1').value.trim() + document.getElementById('w1_2').value.trim(),
        document.getElementById('w2_1').value.trim() + document.getElementById('w2_2').value.trim(),
        document.getElementById('w3_1').value.trim() + document.getElementById('w3_2').value.trim(),
        document.getElementById('w4_1').value.trim() + document.getElementById('w4_2').value.trim() + document.getElementById('w4_3').value.trim()
      ];

      try {
        const response = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ targetDigits, words })
        });

        const data = await response.json();
        resultDiv.classList.remove('hidden');

        if (data.success) {
          resultDiv.classList.add('bg-yellow-400', 'text-black', 'border-yellow-400');
          resultDiv.innerHTML = `🎉 解錠成功！<br>正解です！`;
          cipherDisplay.innerText = `解錠鍵: ${data.readings.join(' / ')}`;
        } else {
          resultDiv.classList.add('bg-red-950', 'text-red-400', 'border-red-800');
          resultDiv.innerText = data.error || '解錠に失敗しました。';
        }
      } catch (err) {
        resultDiv.classList.remove('hidden');
        resultDiv.classList.add('bg-red-950', 'text-red-400', 'border-red-800');
        resultDiv.innerText = '通信エラーが発生しました。';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '解錠（判定）';
      }
    });
  </script>
</body>
</html>
